name: Update news widget

on:
  schedule:
    # 每天北京时间 07:47（UTC 前一天 23:47）运行
    - cron: "47 23 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update news.json
        env:
          APINEBULA_API_KEY: ${{ secrets.APINEBULA_API_KEY }}
          APINEBULA_BASE_URL: https://apinebula.ai/v1
          APINEBULA_MODEL: gpt-6.1-sol
        run: python update_news.py

      - name: Commit changed news
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news.json
          git diff --cached --quiet || git commit -m "chore: update news widget"
          git push
